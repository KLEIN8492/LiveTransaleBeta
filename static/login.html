<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Sign in · LiveTranslate</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--h:262;--bg:oklch(0.150 0.006 var(--h));--sunk:oklch(0.128 0.005 var(--h));--line:oklch(0.255 0.007 var(--h));
  --text:oklch(0.935 0.004 var(--h));--muted:oklch(0.690 0.008 var(--h));--faint:oklch(0.600 0.008 var(--h));--bad:oklch(0.680 0.150 25);
  --sans:"Geist",-apple-system,system-ui,sans-serif;--legend:"Archivo","Arial Narrow",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:400 14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;padding:24px}
main{width:100%;max-width:340px}
.legend{font:600 11px/1 var(--legend);font-stretch:72%;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
h1{font:600 24px/1.2 var(--sans);letter-spacing:-.02em;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
label{display:block;color:var(--muted);font-size:13px;margin:0 0 8px}
input{width:100%;height:44px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:0 12px;font:inherit;color:inherit}
input:focus{outline:none;border-color:var(--muted)}
button{width:100%;height:44px;margin-top:16px;border:0;border-radius:5px;background:var(--text);color:var(--bg);font:600 14px var(--sans);cursor:pointer}
.err{color:var(--bad);font-size:13px;margin:12px 0 0;min-height:1em}
.err:empty{display:none}
[hidden]{display:none!important}
</style></head><body><main>
<p class="legend">LiveTranslate · Control</p>
<form method="post" {{FORM}}>
  <h1>Sign in</h1>
  <p>Control is for admins. Enter the admin password.</p>
  <label for="pw">Admin password</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
  <div class="err" role="alert">{{ERROR}}</div>
  <button>Sign in</button>
</form>
<div {{NOPW}}>
  <h1>Not available yet</h1>
  <p>No admin password has been set, so Control can only be opened on the machine running LiveTranslate.
  There, open Control → Access and set a password.</p>
</div>
</main></body></html>
